<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

    <main class="container">

        <!-- Corações que ficam flutuando ao redor -->

            <span class="heart heart-5">♥</span>
            <span class="heart heart-6">♥</span>
            <span class="heart heart-7">♥</span>
            <span class="heart heart-8">♥</span>
            <span class="heart heart-9">♥</span>
            <span class="heart heart-10">♥</span>
            <span class="heart heart-11">♥</span>
            <span class="heart heart-12">♥</span>
        </div>

        <!-- Coração principal -->
        <div class="main-heart">

            <div class="heart-shape"></div>

            <div class="message">
                <span>I</span><br>
                <strong>Love</strong>
                <span>You</span>
            </div>

        </div>

        <p class="subtitle">para sempre ❤️</p>

    </main>

</body>
</html>
